name: Validate FLAVO SaaS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: node --test tests/*.test.mjs
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flavo-web
          path: dist
  container:
    name: Production container smoke test
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build -t flavo-ci .
      - name: Start isolated production fixture
        run: |
          docker run -d --name flavo-ci --network none \
            -e FLAVO_ENV=production \
            -e FLAVO_PUBLIC_URL=https://flavo.example \
            -e SMTP_HOST=mail.example.invalid \
            -e MAIL_FROM=ci@example.invalid \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_placeholder \
            -e STRIPE_PRICE_STARTER=price_ci_starter \
            -e STRIPE_PRICE_TEAM=price_ci_team \
            flavo-ci
      - name: Wait for the worker and verify production boundaries
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' flavo-ci)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs flavo-ci; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' flavo-ci)" = healthy
          docker exec flavo-ci python scripts/container_smoke.py
      - name: Container logs
        if: failure()
        run: docker logs flavo-ci
      - name: Remove disposable CI container
        if: always()
        run: docker rm -f flavo-ci || true
